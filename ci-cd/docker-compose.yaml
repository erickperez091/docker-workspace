services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      TZ: America/Costa_Rica
    networks:
      - ci_net

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    ports:
      - "8084:8081"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - ci_net

  jenkins-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: jenkins-agent
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "2222:22"  # Para conexión SSH desde Jenkins maestro
    networks:
      - ci_net

volumes:
  jenkins_home:
  nexus_data:

networks:
  ci_net:
    driver: bridge



## ¿Dónde se guarda?                            ¿Cuándo?
## Jenkins container (/var/jenkins_home/.m2)    Si Jenkins ejecuta Maven directamente
## Agente Docker (/root/.m2)                    Si el build se ejecuta en un contenedor agente