services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
      - SERVICES=s3,sqs,sns,lambda,cloudwatch,logs
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
#      - /Users/erick/Downloads:/tmp/Documents